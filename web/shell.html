<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eMine32</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #c8b27a; overflow: hidden;
    font: 14px/1.4 ui-monospace, Consolas, monospace; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* keep the 8-bit pixels crisp and the aspect ratio fixed */
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    width: 100vw; height: 100vh; object-fit: contain; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: rgba(0,0,0,.85); cursor: pointer; text-align: center; }
  #overlay h1 { margin: 0; font-size: 42px; letter-spacing: 4px; color: #e8c040; text-shadow: 3px 3px 0 #6a2a10; }
  #status { min-height: 1.4em; }
  #bar { width: 260px; height: 6px; background: #2a2010; }
  #bar > i { display: block; height: 100%; width: 0; background: #e8c040; }
  #overlay.ready #bar { display: none; }
  #overlay:not(.ready) { cursor: progress; }
  #build { position: fixed; right: 12px; bottom: 8px; font-size: 11px; opacity: .5; }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="overlay"><h1>eMINE32</h1><div id="bar"><i></i></div><div id="status">Loading…</div><div id="build">build __EMINE_BUILD__</div></div>
<script>
  var overlay = document.getElementById('overlay'), statusEl = document.getElementById('status'),
      barEl = document.querySelector('#bar > i'), canvas = document.getElementById('canvas');
  console.log('eMine32 build __EMINE_BUILD__');
  var Module = {
    canvas: canvas,
    noInitialRun: true,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.log(t); },
    setStatus: function (t) {
      var m = t && t.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
      if (m) barEl.style.width = (100 * m[1] / m[2]) + '%';
      if (t) statusEl.textContent = t.replace(/\(.*\)/, '').trim() || 'Loading…';
    },
    onRuntimeInitialized: function () {
      overlay.classList.add('ready');
      statusEl.textContent = 'Click to play';
    }
  };
  // Browsers only allow audio and mouse capture after a user gesture, so start on click.
  overlay.addEventListener('click', function () {
    if (!overlay.classList.contains('ready')) return;
    overlay.remove();
    canvas.focus();
    Module.callMain(Module.emineArgs || []);
  });
  // Let the browser keep F11 (fullscreen) and F12 (dev tools): stop them before SDL sees and swallows them.
  ['keydown', 'keyup', 'keypress'].forEach(function (type) {
    window.addEventListener(type, function (e) {
      if (e.key === 'F11' || e.key === 'F12') e.stopImmediatePropagation();
    }, true);
  });
  // Mouse back/forward buttons belong to the game (back = back out of menus), not browser navigation.
  ['mousedown', 'mouseup', 'auxclick'].forEach(function (type) {
    window.addEventListener(type, function (e) {
      if (e.button !== 3 && e.button !== 4) return;
      e.preventDefault();
      if (type !== 'auxclick' && Module._emine_mouse_xbutton) Module._emine_mouse_xbutton(e.button - 3, type === 'mousedown' ? 1 : 0);
    }, true);
  });
  // Mouse capture: browsers only allow pointer lock inside a user gesture, but the game grabs the mouse from its
  // own loop (e.g. when a level starts). So on every key/click, if the game wants the mouse and doesn't have it,
  // request it here. Clicking the game always captures; Esc releases (and opens the menu).
  function wantLock() {
    // always ask (it also repairs the engine's grab state), then lock if the game wants the mouse
    var want = Module._emine_mouse_wanted && Module._emine_mouse_wanted();
    return want && document.pointerLockElement !== canvas;
  }
  canvas.addEventListener('click', function () { if (document.pointerLockElement !== canvas) canvas.requestPointerLock(); });
  window.addEventListener('keydown', function (e) { if (e.key !== 'Escape' && wantLock()) canvas.requestPointerLock(); });
  window.addEventListener('mousedown', function () { if (wantLock()) canvas.requestPointerLock(); });
  // Follow the window size (F11, dragging the window): ask the engine to switch resolution once things settle.
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    if (/[?&]res=/.test(location.search)) return;  // explicit resolution: just scale
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!Module._emine_request_resize || !Module.emineRes) return;
      var r = Module.emineRes();
      Module._emine_request_resize(r[0], r[1]);
    }, 250);
  });
  // emine_perf: mouse movement as the browser delivers it to the page (summed; the engine reads and resets it each
  // frame), to tell input the browser holds back from input the engine is slow to take.
  // emineMouseLag: the most any event was late (ms from when the browser stamped it to when the page got it).
  Module.emineMouseJS = 0; Module.emineMouseEvents = 0; Module.emineMouseLag = 0;
  document.addEventListener('mousemove', function (e) {
    Module.emineMouseJS += e.movementX || 0; Module.emineMouseEvents++;
    var lag = performance.now() - e.timeStamp;
    if (lag > Module.emineMouseLag) Module.emineMouseLag = lag;
  }, true);
  // Adaptive resolution. The browser shows a frame on each display refresh, so a frame that takes even a little
  // longer than one refresh waits for the next: the frame rate halves and turning looks jumpy. Watch the engine's
  // work per frame (its slow frames: the 90th percentile) against the refresh interval; when they run close to the
  // budget, render fewer pixels (the canvas
  // is stretched to the window either way), and when there's plenty to spare, go back up. ?res or ?scale turn it off.
  (function () {
    if (/[?&](res|scale)=/.test(location.search)) return;
    var deltas = [], last = 0, over = 0, under = 0, STEP = 1.2, MAX = 3, holdUntil = 0;  // no going back up for a while after a step down (no bouncing)
    Module.emineAutoScale = 1;
    function tick(t) { if (last) { deltas.push(t - last); if (deltas.length > 120) deltas.shift(); } last = t; requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
    function rescale(f) {
      Module.emineAutoScale = Math.min(MAX, Math.max(1, Module.emineAutoScale * f));
      if (Module.emineAutoScale < 1.01) Module.emineAutoScale = 1;
      var r = Module.emineRes();
      Module._emine_request_resize(r[0], r[1]);
      console.log('eMine32 render scale ' + Module.emineAutoScale.toFixed(2) + ': ' + r[0] + 'x' + r[1]);
      over = under = 0;
    }
    setInterval(function () {
      if (!Module._emine_frame_work_ms || !Module._emine_request_resize || deltas.length < 30 || document.hidden) return;
      var work = Module._emine_frame_work_ms();
      if (!work || work > 3 * 16.7) return;  // nothing drawn, or a level loading: not a measure of drawing
      var refresh = deltas.slice().sort(function (a, b) { return a - b; })[deltas.length >> 1];  // median
      if (work > 0.8 * refresh) { under = 0; if (++over >= 2 && Module.emineAutoScale < MAX) { rescale(STEP); holdUntil = Date.now() + 60000; } }
      else if (work < 0.5 * refresh) { over = 0; if (++under >= 6 && Module.emineAutoScale > 1 && Date.now() > holdUntil) rescale(1 / STEP); }
      else over = under = 0;
    }, 1000);
  })();
  window.addEventListener('error', function (e) { statusEl.textContent = 'Error: ' + e.message; });
</script>
{{{ SCRIPT }}}
</body>
</html>
